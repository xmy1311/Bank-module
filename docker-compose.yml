# ==============================================================================
# Devsu — Prueba Técnica .NET
#
#   docker compose up --build
#
# Levanta SQL Server, RabbitMQ y los dos microservicios. Las APIs esperan a que
# sus dependencias estén SANAS (no solo arrancadas) antes de iniciarse, aplican
# sus migraciones y siembran los datos del enunciado.
#
# Copia .env.example a .env antes de ejecutar:  cp .env.example .env
# ==============================================================================

name: devsu-banking

services:

  # ──────────────────────────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: devsu-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD en .env}
      MSSQL_PID: "Developer"
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # No basta con que el contenedor exista: SQL Server tarda ~40 s en aceptar
      # conexiones. Sin esto, las APIs arrancarían contra una base inexistente.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [devsu]

  # ──────────────────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: devsu-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-devsu}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Define RABBITMQ_DEFAULT_PASS en .env}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"   # UI de administración
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [devsu]

  # ──────────────────────────────────────────────────────────────────────────
  customer-api:
    build:
      # Contexto en la RAÍZ para que Directory.Build.props y
      # Directory.Packages.props sean visibles durante el restore.
      context: .
      dockerfile: src/Services/Customer/Devsu.Customer.Api/Dockerfile
    container_name: devsu-customer-api
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # Dentro de la red de Docker el puerto SIEMPRE es el interno (1433, 5672),
      # sin importar qué se haya mapeado al host.
      ConnectionStrings__CustomerDb: "Server=sqlserver,1433;Database=CustomerDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__Usuario: ${RABBITMQ_DEFAULT_USER:-devsu}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${CUSTOMER_API_PORT:-5001}:8080"
    healthcheck:
      # /health es LIVENESS: no toca la base de datos. Si la tocara, una caída
      # momentánea de SQL Server haría que Docker reiniciara un contenedor sano.
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks: [devsu]

  # ──────────────────────────────────────────────────────────────────────────
  account-api:
    build:
      context: .
      dockerfile: src/Services/Account/Devsu.Account.Api/Dockerfile
    container_name: devsu-account-api
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__AccountDb: "Server=sqlserver,1433;Database=AccountDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__Usuario: ${RABBITMQ_DEFAULT_USER:-devsu}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${ACCOUNT_API_PORT:-5002}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks: [devsu]

# ──────────────────────────────────────────────────────────────────────────────
volumes:
  sqlserver-data:
  rabbitmq-data:

networks:
  devsu:
    driver: bridge
